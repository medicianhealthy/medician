# Gradle Performance Features
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.tooling.parallel=true
org.gradle.workers.max=4

# JVM Arguments: Tweaked for a 16GB system running near 90% memory usage.
# Reduced max heaps to prevent system paging, and switched to ZGC (Generational) for lower memory overhead and better pause times on Java 21+.
org.gradle.jvmargs=-Xmx1536M -Dkotlin.daemon.jvm.options="-Xmx1024M" -Dfile.encoding=UTF-8 -XX:+UseZGC -XX:+ZGenerational

# Android Build Features
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.enableAppCompileTimeRClass=true

# Keep this to prevent AGP from attempting to compile unconfigured Kotlin/Compose mockup files in your project
android.builtInKotlin=false

# R8/ProGuard settings
# Set these to 'true' in the future for better shrinking and smaller APKs
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false

# Suppress deprecation warnings for builtInKotlin and optimizedResourceShrinking (AGP 10.0 prep)
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE