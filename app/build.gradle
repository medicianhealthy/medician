plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.google.gms.google.services)
    alias(libs.plugins.google.firebase.crashlytics)
}

android {

    defaultConfig {
        applicationId "com.robinzon.medicationwizard"
        minSdk rootProject.SDK_MINIMUM_VERSION
        targetSdk rootProject.SDK_TARGET_VERSION
        versionCode rootProject.VERSION_CODE
        versionName rootProject.VERSION_NAME
        multiDexEnabled true
    }

    compileSdk = libs.versions.compileSdk.get().toInteger()

    buildTypes {
        release {
            debuggable false
            // Enables code shrinking, obfuscation, and optimization for only
            // your project's release build type.
            minifyEnabled true
            // Enables resource shrinking, which is performed by the
            // Android Gradle plugin.
            shrinkResources true
            // Includes the default ProGuard rules files that are packaged with
            // the Android Gradle plugin. To learn more, go to the section about
            // R8 configuration files.
            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
        debug {
            debuggable true
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    packaging {
        resources {
            excludes += "/META-INF/INDEX.LIST"
        }
    }
    namespace 'com.robinzon.medicationwizard'

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "MedicationWizard-v${variant.versionName}-${variant.versionCode}-${variant.buildType.name}.apk"
        }
    }

    // Rename App Bundles (AAB)
    tasks.matching { it.name.startsWith("bundle") && (it.name.endsWith("Release") || it.name.endsWith("Debug")) }.configureEach { task ->
        def vName = rootProject.VERSION_NAME
        def vCode = rootProject.VERSION_CODE
        def buildType = task.name.endsWith("Release") ? "release" : "debug"
        def outputDirProvider = layout.buildDirectory.dir("outputs/bundle/${buildType}")

        task.doLast {
            def bundleName = "MedicationWizard-v${vName}-${vCode}-${buildType}.aab"
            def outputDir = outputDirProvider.get().asFile
            def originalFile = new File(outputDir, "app-${buildType}.aab")
            if (originalFile.exists()) {
                originalFile.renameTo(new File(outputDir, bundleName))
            }
        }
    }
}

dependencies {
    implementation(platform(libs.kotlin.bom))
    //Ads
    implementation libs.play.services.ads
    implementation libs.firebase.ads
    //Material
    implementation libs.material

    // Google Drive Backup Dependencies
    implementation libs.play.services.auth
    implementation(libs.google.api.services.drive) {
        exclude group: 'org.apache.httpcomponents'
    }
    implementation(libs.google.api.client.android) {
        exclude group: 'org.apache.httpcomponents'
    }

    // Image Loading
    implementation libs.glide
    annotationProcessor libs.compiler

    // WorkManager
    implementation libs.androidx.work.runtime

    // Play Review
    implementation libs.review

    // Play Billing
    implementation libs.billing

    // Google User Messaging Platform (Consent)
    implementation libs.ump

    // Room
    implementation libs.androidx.room.runtime
    annotationProcessor libs.androidx.room.compiler

    //Android X
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.appcompat
    implementation libs.androidx.navigation.fragment
    implementation libs.androidx.navigation.ui
    implementation libs.androidx.swiperefreshlayout
    //Firebase
    // https://firebase.google.com/docs/android/learn-more#compare-bom-versions
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.analytics
    implementation libs.firebase.config
    implementation libs.firebase.inappmessaging
    implementation libs.firebase.inappmessaging.display
    implementation libs.firebase.messaging
    implementation libs.firebase.crashlytics

    // Explicit gRPC for Firebase compatibility
    implementation libs.grpc.okhttp
    implementation libs.grpc.protobuf.lite
    implementation libs.grpc.stub
    implementation libs.grpc.android

    implementation libs.androidx.lifecycle.runtime
    implementation libs.androidx.lifecycle.process
    annotationProcessor libs.androidx.lifecycle.common.java8
}