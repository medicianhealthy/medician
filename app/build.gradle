plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {

    defaultConfig {
        applicationId "com.robinzon.medicationwizard"
        minSdk rootProject.SDK_MINIMUM_VERSION
        targetSdk rootProject.SDK_TARGET_VERSION
        versionCode rootProject.VERSION_CODE
        versionName rootProject.VERSION_NAME
        multiDexEnabled true
    }

    compileSdk = rootProject.SDK_COMPILE_VERSION

    buildTypes {
        release {
            debuggable false
            // Enables code shrinking, obfuscation, and optimization for only
            // your project's release build type.
            minifyEnabled true
            // Enables resource shrinking, which is performed by the
            // Android Gradle plugin.
            shrinkResources true
            // Includes the default ProGuard rules files that are packaged with
            // the Android Gradle plugin. To learn more, go to the section about
            // R8 configuration files.
            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
        debug {
            debuggable true
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    namespace 'com.robinzon.medicationwizard'
}

dependencies {
    implementation(platform('org.jetbrains.kotlin:kotlin-bom:2.4.0'))
    //Ads
    implementation 'com.google.android.gms:play-services-ads:25.3.0'
    implementation 'com.google.firebase:firebase-ads:23.6.0'
    //Material
    implementation 'com.google.android.material:material:1.14.0'
    
    // Google Drive Backup Dependencies
    implementation 'com.google.android.gms:play-services-auth:21.6.0'
    implementation('com.google.apis:google-api-services-drive:v3-rev20230822-2.0.0') {
        exclude group: 'org.apache.httpcomponents'
    }
    implementation('com.google.api-client:google-api-client-android:2.9.0') {
        exclude group: 'org.apache.httpcomponents'
    }
    
    // Image Loading
    implementation 'com.github.bumptech.glide:glide:5.0.7'
    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.7'
    
    // WorkManager
    implementation 'androidx.work:work-runtime:2.11.2'

    // Play Review
    implementation 'com.google.android.play:review:2.0.2'
    
    // Play Billing
    implementation 'com.android.billingclient:billing:9.0.0'

    // Google User Messaging Platform (Consent)
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'

    // Room
    implementation 'androidx.room:room-runtime:2.8.4'
    annotationProcessor 'androidx.room:room-compiler:2.8.4'

    //Android X
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.navigation:navigation-fragment:2.9.8'
    implementation 'androidx.navigation:navigation-ui:2.9.8'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    //Firebase
    // https://firebase.google.com/docs/android/learn-more#compare-bom-versions
    implementation platform('com.google.firebase:firebase-bom:34.14.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-config'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-inappmessaging'
    implementation 'com.google.firebase:firebase-inappmessaging-display'

    // Explicit gRPC for Firebase compatibility
    implementation 'io.grpc:grpc-okhttp:1.81.0'
    implementation 'io.grpc:grpc-protobuf-lite:1.81.0'
    implementation 'io.grpc:grpc-stub:1.81.0'
    implementation 'io.grpc:grpc-android:1.81.0'

    implementation 'androidx.lifecycle:lifecycle-runtime:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.10.0'
    annotationProcessor 'androidx.lifecycle:lifecycle-common-java8:2.10.0'
}