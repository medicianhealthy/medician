plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.google.gms.google.services)
    alias(libs.plugins.google.firebase.crashlytics)
}

android {

    defaultConfig {
        applicationId "com.robinzon.medicationwizard"
        minSdk rootProject.SDK_MINIMUM_VERSION
        targetSdk rootProject.SDK_TARGET_VERSION
        versionCode rootProject.VERSION_CODE
        versionName rootProject.VERSION_NAME
        multiDexEnabled true
    }

    compileSdk = rootProject.SDK_COMPILE_VERSION

    buildTypes {
        release {
            debuggable false
            // Enables code shrinking, obfuscation, and optimization for only
            // your project's release build type.
            minifyEnabled true
            // Enables resource shrinking, which is performed by the
            // Android Gradle plugin.
            shrinkResources true
            // Includes the default ProGuard rules files that are packaged with
            // the Android Gradle plugin. To learn more, go to the section about
            // R8 configuration files.
            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
        debug {
            debuggable true
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    packaging {
        resources {
            excludes += "/META-INF/INDEX.LIST"
        }
    }
    sourceSets {
        main {
            java {
                exclude '**/*Preview.kt'
            }
        }
    }
    namespace 'com.robinzon.medicationwizard'
}

androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    variant.outputs.each { output ->
        output.outputFileName.set("MedicationWizard-v${rootProject.VERSION_NAME}-${rootProject.VERSION_CODE}-${variant.buildType}.apk")
    }
}

    // Rename App Bundles (AAB)
    tasks.matching { it.name.startsWith("bundle") && (it.name.endsWith("Release") || it.name.endsWith("Debug")) }.configureEach { task ->
        def vName = rootProject.VERSION_NAME
        def vCode = rootProject.VERSION_CODE
        def buildType = task.name.endsWith("Release") ? "release" : "debug"

        // Extract the build directory outside the doLast closure for configuration cache compatibility
        def buildDir = layout.buildDirectory.dir("outputs/bundle/${buildType}").get().asFile

        // 2. Check Android Studio custom export location (used by Generate Signed Bundle)
        // Extract project properties OUTSIDE the doLast closure for configuration cache compatibility
        def apkLocationProp = project.findProperty("android.injected.apk.location")
        def bundleLocationProp = project.findProperty("android.injected.bundle.location")

        task.doLast {
            def bundleName = "MedicationWizard-v${vName}-${vCode}-${buildType}.aab"
            
            // 1. Check default build directory
            def defaultDir = buildDir
            
            // 2. Resolve custom export location
            def customIdeDir = null
            if (apkLocationProp != null) {
                customIdeDir = new File(apkLocationProp.toString())
            }
            if (bundleLocationProp != null) {
                customIdeDir = new File(bundleLocationProp.toString())
            }

            // AS usually creates a 'release' or 'debug' subfolder inside the custom selected folder
            def dirsToCheck = [defaultDir, customIdeDir]
            if (customIdeDir != null) {
                dirsToCheck.add(new File(customIdeDir, buildType))
            }

            dirsToCheck.findAll { it != null && it.exists() }.each { dir ->
                def originalFiles = [
                    new File(dir, "app-${buildType}.aab"),
                    new File(dir, "app.aab")
                ]
                
                originalFiles.each { file ->
                    if (file.exists()) {
                        file.renameTo(new File(dir, bundleName))
                        println "Successfully renamed AAB to: ${new File(dir, bundleName).absolutePath}"
                    }
                }
            }
        }
    }

