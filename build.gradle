// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    //Android sdk  -->   https://developer.android.com/tools/releases/platforms
    project.ext.set("SDK_MINIMUM_VERSION", 28) //Android 9.0
    project.ext.set("SDK_COMPILE_VERSION", 36) //Android 16.0
    project.ext.set("SDK_TARGET_VERSION", 36) //Android 16.0
    //App version
    project.ext.set("VERSION_CODE", 100000001)
    project.ext.set("VERSION_NAME", "1.0.1")
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.0'
        classpath 'com.google.gms:google-services:4.4.4'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.7'
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
