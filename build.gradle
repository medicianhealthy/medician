// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    //Android sdk  -->   https://developer.android.com/tools/releases/platforms
    project.ext.set("SDK_MINIMUM_VERSION", 24) //Android 7.0
    project.ext.set("SDK_COMPILE_VERSION", 34) //Android 14
    project.ext.set("SDK_TARGET_VERSION", 34) //Android 14
    //App version
    project.ext.set("VERSION_CODE", 101)
    project.ext.set("VERSION_NAME", "1.0.1")
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
        classpath 'com.google.gms:google-services:4.4.0'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.9.9'
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}